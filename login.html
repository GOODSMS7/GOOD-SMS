<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="GOOD SMS - Acesso ao painel administrativo"
    >

    <meta
        name="theme-color"
        content="#08050d"
    >

    <title>GOOD SMS | Login</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-background"></div>

        <section class="login-container">

            <a href="index.html" class="login-logo">
                <span class="logo-good">GOOD</span>
                <span class="logo-sms">SMS</span>
            </a>

            <div class="login-header">

                <div class="login-status">
                    <span class="status-dot"></span>
                    Ambiente protegido
                </div>

                <h1>
                    Acesso administrativo
                </h1>

                <p>
                    Entre com suas credenciais para acessar
                    o painel de controle da GOOD SMS.
                </p>

            </div>

            <form id="loginForm" class="login-form">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="pin">
                        PIN de segurança
                    </label>

                    <input
                        type="password"
                        id="pin"
                        name="pin"
                        placeholder="000000"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        minlength="6"
                        maxlength="6"
                        autocomplete="one-time-code"
                        required
                    >

                    <small>
                        Digite o PIN administrativo de 6 dígitos.
                    </small>

                </div>

                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    class="btn-primary login-button"
                >
                    Entrar no painel
                </button>

            </form>

            <div class="login-security">

                <div class="security-icon">
                    ●
                </div>

                <div>
                    <strong>Área restrita</strong>

                    <span>
                        Todas as tentativas de acesso poderão
                        ser registradas para auditoria.
                    </span>
                </div>

            </div>

            <a href="index.html" class="back-link">
                ← Voltar para o site
            </a>

        </section>

    </main>

    <script src="js/auth.js"></script>

</body>

</html>
